name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  namespace-qualification:
    runs-on: namespace-profile-imrse
    timeout-minutes: 3
    steps:
      - name: Verify Linux runner and container capability
        shell: bash
        run: |
          uname -sm
          test "$(uname -s)" = Linux
          docker version --format '{{.Server.Os}}/{{.Server.Arch}}'
          docker run --rm --pull=always alpine:3.21 uname -sm
  portable:
    needs: namespace-qualification
    runs-on: namespace-profile-imrse
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: swift test -Xswiftc -warnings-as-errors
      - run: swift test --package-path pill-kit/native -Xswiftc -warnings-as-errors
  native:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: xcodebuild -version && swift --version
      - run: swift test --jobs 1 -Xswiftc -warnings-as-errors
      - run: swift test --package-path pill-kit/native -Xswiftc -warnings-as-errors
      - run: python3 pill-kit/scripts/verify-assets.py
  package:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      IMRSE_CI_PACKAGE_VALIDATION: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: xcodebuild -version && swift --version
      - run: bash -n scripts/build-app.sh
      - run: plutil -lint Resources/Info.plist
      - run: python3 -m unittest discover -s scripts/tests -p 'test_package_local_candidate.py' -v
      - name: Ensure Metal compiler is available
        run: |
          if ! xcrun --sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun --sdk macosx metal --version
      - run: ./scripts/build-app.sh
        env:
          IMRSE_DIST_DIR: ${{ runner.temp }}/imrse-ci-package-validation
      - name: Archive validation package for controlled local verification
        shell: bash
        run: |
          test "$(uname -m)" = arm64
          test -z "$(git status --porcelain)"
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/imrse-ci-package-validation/imrse.app" \
            "$RUNNER_TEMP/imrse-validation.zip"
          python3 - <<'PY'
          import hashlib, json, os, platform, subprocess
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          record = {
              "sourceCommitSHA": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "sourceTreeSHA": subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip(),
              "architecture": platform.machine(),
              "runID": os.environ["GITHUB_RUN_ID"],
              "runAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "archiveSHA256": hashlib.sha256((root / "imrse-validation.zip").read_bytes()).hexdigest(),
              "signing": "CI validation only; requires the existing local signer before installation",
          }
          (root / "imrse-validation.json").write_text(json.dumps(record, indent=2) + "\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: imrse-validation-package
          retention-days: 1
          path: |
            ${{ runner.temp }}/imrse-validation.zip
            ${{ runner.temp }}/imrse-validation.json
  design:
    needs: namespace-qualification
    runs-on: namespace-profile-imrse
    defaults:
      run:
        working-directory: pill-kit/web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: pill-kit/web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run typecheck
      - run: npm run test:browser
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: visual-states
          path: pill-kit/web/test-results
