name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  namespace-qualification:
    runs-on: namespace-profile-imrse
    timeout-minutes: 3
    steps:
      - name: Verify Linux runner and container capability
        shell: bash
        run: |
          uname -sm
          test "$(uname -s)" = Linux
          docker version --format '{{.Server.Os}}/{{.Server.Arch}}'
          docker run --rm --pull=always alpine:3.21 uname -sm
  portable:
    needs: namespace-qualification
    runs-on: namespace-profile-imrse
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: swift test -Xswiftc -warnings-as-errors
      - run: swift test --package-path pill-kit/native -Xswiftc -warnings-as-errors
  native:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: xcodebuild -version && swift --version
      - run: swift test --jobs 1 -Xswiftc -warnings-as-errors
      - run: swift test --package-path pill-kit/native -Xswiftc -warnings-as-errors
      - run: python3 pill-kit/scripts/verify-assets.py
  package:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      IMRSE_CI_PACKAGE_VALIDATION: "1"
      IMRSE_EXPECTED_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Require arm64 and record the toolchain
        run: |
          set -euo pipefail
          uname -sm
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          IMRSE_CI_CANDIDATE_DIR="$RUNNER_TEMP/imrse-ci-candidate"
          IMRSE_DIST_DIR="$RUNNER_TEMP/imrse-ci-package-validation"
          echo "IMRSE_CI_CANDIDATE_DIR=$IMRSE_CI_CANDIDATE_DIR" >> "$GITHUB_ENV"
          echo "IMRSE_DIST_DIR=$IMRSE_DIST_DIR" >> "$GITHUB_ENV"
          test ! -e "$IMRSE_CI_CANDIDATE_DIR"
          mkdir -p "$IMRSE_CI_CANDIDATE_DIR"
          xcodebuild -version | tee "$IMRSE_CI_CANDIDATE_DIR/xcode-version.txt"
          swift --version | tee "$IMRSE_CI_CANDIDATE_DIR/swift-version.txt"
      - run: bash -n scripts/build-app.sh
      - run: plutil -lint Resources/Info.plist
      - run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - name: Ensure Metal compiler is available
        run: |
          if ! xcrun --sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun --sdk macosx metal --version
      - name: Run vendored EventSource suite without optional traits
        run: |
          set -o pipefail
          swift test --package-path Vendor/EventSource --jobs 1 -Xswiftc -warnings-as-errors 2>&1 | tee "$IMRSE_CI_CANDIDATE_DIR/eventsource-tests.log"
          git diff --exit-code -- Package.resolved Vendor/EventSource
          test -z "$(git status --porcelain -- Package.resolved Vendor/EventSource)"
      - name: Resolve the root graph from the frozen lock
        run: |
          set -o pipefail
          swift package resolve --only-use-versions-from-resolved-file 2>&1 | tee "$IMRSE_CI_CANDIDATE_DIR/root-resolve.log"
          git diff --exit-code -- Package.resolved
          swift package show-dependencies --only-use-versions-from-resolved-file --format json > "$IMRSE_CI_CANDIDATE_DIR/root-effective-dependency-graph.json" 2> "$IMRSE_CI_CANDIDATE_DIR/root-show-dependencies.log"
          git diff --exit-code -- Package.resolved
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          root = Path.cwd().resolve()
          graph = json.loads((Path(os.environ["IMRSE_CI_CANDIDATE_DIR"]) / "root-effective-dependency-graph.json").read_text())
          pins = {item["identity"].lower(): item["state"] for item in json.loads(Path("Package.resolved").read_text())["pins"]}
          nodes, pending = [], [graph]
          while pending:
              node = pending.pop()
              if not isinstance(node, dict) or not isinstance(node.get("dependencies", []), list):
                  raise SystemExit("invalid root dependency graph")
              nodes.append(node)
              pending.extend(node.get("dependencies", []))
          vendor = (root / "Vendor/EventSource").resolve()
          checkouts = (root / ".build/checkouts").resolve()
          found_vendor = False
          for node in nodes:
              raw = node.get("path")
              path = Path(raw) if isinstance(raw, str) else None
              resolved = (path if path and path.is_absolute() else root / path).resolve() if path else None
              identity = str(node.get("identity") or (path.name if path else node.get("name", ""))).lower()
              names = {"".join(c for c in value.lower() if c.isalnum()) for value in (identity, str(node.get("name", "")))}
              if resolved == vendor or identity.replace("-", "") == "eventsource" or "eventsource" in names:
                  found_vendor = True
                  if resolved != vendor:
                      raise SystemExit("EventSource must resolve to Vendor/EventSource, not its historical remote pin")
              if any(name == "asynchttpclient" or name.startswith("swiftnio") or
                     name in {"niocore", "nioposix", "niohttp1", "niohttp2", "niossl", "niotls"} for name in names):
                  raise SystemExit("root graph activates optional EventSource AsyncHTTPClient/NIO dependencies")
              if resolved and resolved != vendor and resolved.is_relative_to(checkouts):
                  if identity not in pins or resolved != checkouts / identity:
                      raise SystemExit(f"invalid locked checkout: {identity}")
                  revision = subprocess.check_output(["git", "-C", str(resolved), "rev-parse", "HEAD"], text=True).strip()
                  if revision != pins[identity].get("revision"):
                      raise SystemExit(f"checkout revision differs from Package.resolved: {identity}")
                  version = pins[identity].get("version")
                  if version and node.get("version") and version != node["version"]:
                      raise SystemExit(f"checkout version differs from Package.resolved: {identity}")
              elif resolved not in {root, root / "pill-kit/native", vendor}:
                  raise SystemExit(f"remote dependency is outside .build/checkouts: {identity}")
          if not found_vendor:
              raise SystemExit("root graph omits local EventSource")
          log = (Path(os.environ["IMRSE_CI_CANDIDATE_DIR"]) / "eventsource-tests.log").read_text().splitlines()
          tests = {
              "callbackDeliveryAndOrder": "URLSession.AsyncBytes delivers public callbacks in order",
              "closeFromFirstMessageStopsStream": "Closing in the first message callback stops later data and reconnection",
              "closeFromOpenPreventsLateCallbacks": "Closing from open before byte consumption suppresses late callbacks",
          }
          for function, title in tests.items():
              events = [line for line in log if "Test " in line and (function in line or title in line)]
              if len(events) != 2 or sum("started" in line for line in events) != 1 or sum("passed" in line for line in events) != 1:
                  raise SystemExit(f"EventSource test did not run and pass exactly once: {function}")
          status = subprocess.check_output(["git", "status", "--porcelain", "--", "Package.resolved", "Vendor/EventSource"], text=True)
          if status.strip():
              raise SystemExit("Package.resolved or vendored EventSource changed during validation")
          print("Verified locked root graph and all three ConcreteTransportTests.")
          PY
      - name: Enable only the two reviewed revision-bound extensions
        run: |
          python3 scripts/enable-ci-extensions.py --source-root . --receipt "$IMRSE_CI_CANDIDATE_DIR/extension-enablement.json"
      - name: Build the unsigned CI app with one scheduler job and WMO frontend thread
        id: ci-build
        run: |
          set -o pipefail
          ./scripts/build-app.sh 2>&1 | tee "$IMRSE_CI_CANDIDATE_DIR/build.log"
          grep -F 'CI native build command:' "$IMRSE_CI_CANDIDATE_DIR/build.log" | grep -F -- '-jobs 1' | grep -F -- 'SWIFT_TREAT_WARNINGS_AS_ERRORS=YES' | grep -F -- 'SWIFT_COMPILATION_MODE=wholemodule'
          grep -E 'swiftc|swift-frontend' "$IMRSE_CI_CANDIDATE_DIR/build.log" | grep -F -- '-warnings-as-errors' | grep -F -- '-whole-module-optimization'
          grep -F 'builtin-SwiftDriver --' "$IMRSE_CI_CANDIDATE_DIR/build.log" | grep -F -- '-num-threads 1'
          if grep -E 'builtin-SwiftDriver --.* (-suppress-warnings|-num-threads ([2-9]|[1-9][0-9]))' "$IMRSE_CI_CANDIDATE_DIR/build.log"; then
            echo 'Compiler settings weakened warning validation or frontend thread count.' >&2
            exit 1
          fi
          git diff --exit-code -- Package.resolved Vendor/EventSource
          test -z "$(git status --porcelain -- Package.resolved Vendor/EventSource)"
      - name: Retain and check the RealModule output contract
        if: always()
        env:
          IMRSE_CI_BUILD_OUTCOME: ${{ steps.ci-build.outcome }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import shutil
          from pathlib import Path

          if "IMRSE_CI_CANDIDATE_DIR" not in os.environ:
              raise SystemExit(0)
          output = Path(os.environ["IMRSE_CI_CANDIDATE_DIR"])
          objects = Path(".build/ci-derived-data/Build/Intermediates.noindex/swift-numerics.build/Release/RealModule.build/Objects-normal/arm64")
          if output.is_dir() and objects.is_dir():
              for name in ("RealModule-OutputFileMap.json", "RealModule.LinkFileList"):
                  if (objects / name).is_file():
                      shutil.copyfile(objects / name, output / name)
              link_list = objects / "RealModule.LinkFileList"
              listed = link_list.read_text().splitlines() if link_list.is_file() else []
              present = {item: Path(item).is_file() and Path(item).stat().st_size > 0 for item in listed}
              (output / "RealModule-object-inventory.json").write_text(json.dumps(present, indent=2, sort_keys=True) + "\n")
              if os.environ["IMRSE_CI_BUILD_OUTCOME"] == "success" and (not present or not all(present.values()) or not (objects / "AlgebraicField.o").is_file()):
                  raise SystemExit("RealModule compile/link object contract is incomplete")
          elif os.environ["IMRSE_CI_BUILD_OUTCOME"] == "success":
              raise SystemExit("RealModule compile/link object evidence is missing")
          PY
      - name: Validate and archive the CI candidate
        run: |
          set -o pipefail
          cp "$IMRSE_DIST_DIR/CI-BUILD-COMMAND.txt" "$IMRSE_CI_CANDIDATE_DIR/"
          python3 scripts/export-ci-candidate.py \
            --source-root . \
            --expected-commit "$IMRSE_EXPECTED_SOURCE_COMMIT" \
            --graph-json "$IMRSE_CI_CANDIDATE_DIR/root-effective-dependency-graph.json" \
            --eventsource-test-log "$IMRSE_CI_CANDIDATE_DIR/eventsource-tests.log" \
            --app "$IMRSE_DIST_DIR/imrse.app" \
            --output-dir "$IMRSE_CI_CANDIDATE_DIR" \
            --swift-version-log "$IMRSE_CI_CANDIDATE_DIR/swift-version.txt" \
            --xcode-version-log "$IMRSE_CI_CANDIDATE_DIR/xcode-version.txt" \
            --build-log "$IMRSE_CI_CANDIDATE_DIR/build.log" 2>&1 | tee "$IMRSE_CI_CANDIDATE_DIR/export.log"
      - uses: actions/upload-artifact@v4
        with:
          name: imrse-ci-arm64-unsigned-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/imrse-ci-candidate
          if-no-files-found: error
      - name: Retain failed build diagnostics without a candidate
        if: failure()
        run: |
          if [ -d "$IMRSE_DIST_DIR/CI-BUILD.xcresult" ]; then
            xcrun xcresulttool get object --legacy --format json --path "$IMRSE_DIST_DIR/CI-BUILD.xcresult" > "$IMRSE_CI_CANDIDATE_DIR/failed-build-result.json"
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: imrse-ci-failure-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/imrse-ci-candidate
          if-no-files-found: warn
  design:
    needs: namespace-qualification
    runs-on: namespace-profile-imrse
    defaults:
      run:
        working-directory: pill-kit/web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: pill-kit/web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run typecheck
      - run: npm run test:browser
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: visual-states
          path: pill-kit/web/test-results
