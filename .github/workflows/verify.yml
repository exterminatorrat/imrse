name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: Verify the default jobs or run the exact hosted combined build
        type: choice
        options:
          - verify
          - hosted-combined-535b7f8
        default: verify
      qualification_only:
        description: Observe the hosted Mac without resolving or building packages
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  namespace-qualification:
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.mode == 'verify' && !inputs.qualification_only) }}
    runs-on: namespace-profile-imrse
    timeout-minutes: 3
    steps:
      - name: Verify Linux runner and container capability
        shell: bash
        run: |
          uname -sm
          test "$(uname -s)" = Linux
          docker version --format '{{.Server.Os}}/{{.Server.Arch}}'
          docker run --rm --pull=always alpine:3.21 uname -sm
  portable:
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.mode == 'verify' && !inputs.qualification_only) }}
    needs: namespace-qualification
    runs-on: namespace-profile-imrse
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: swift test -Xswiftc -warnings-as-errors
      - run: swift test --package-path pill-kit/native -Xswiftc -warnings-as-errors
  native:
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.mode == 'verify' && !inputs.qualification_only) }}
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: xcodebuild -version && swift --version
      - run: swift test --jobs 1 -Xswiftc -warnings-as-errors
      - run: swift test --package-path pill-kit/native -Xswiftc -warnings-as-errors
      - run: python3 pill-kit/scripts/verify-assets.py
  package:
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.mode == 'verify' && !inputs.qualification_only) }}
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      IMRSE_CI_PACKAGE_VALIDATION: "1"
      IMRSE_EXPECTED_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: xcodebuild -version && swift --version
      - run: bash -n scripts/build-app.sh
      - run: plutil -lint Resources/Info.plist
      - run: python3 -m unittest discover -s scripts/tests -p 'test_package_local_candidate.py' -v
      - name: Ensure Metal compiler is available
        run: |
          if ! xcrun --sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun --sdk macosx metal --version
      - run: ./scripts/build-app.sh
        env:
          IMRSE_DIST_DIR: ${{ runner.temp }}/imrse-ci-package-validation
      - name: Retain the exact unsigned test application
        run: |
          python3 scripts/retain_ci_test_app.py \
            --source-root . \
            --expected-commit "$IMRSE_EXPECTED_SOURCE_COMMIT" \
            --app "$RUNNER_TEMP/imrse-ci-package-validation/imrse.app" \
            --output-dir "$RUNNER_TEMP/imrse-ci-test-app" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: imrse-ci-test-app-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/imrse-ci-test-app/imrse-ci-test-app-arm64.tar.gz
            ${{ runner.temp }}/imrse-ci-test-app/ci-test-app-manifest.json
            ${{ runner.temp }}/imrse-ci-test-app/SHA256SUMS
  design:
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.mode == 'verify' && !inputs.qualification_only) }}
    needs: namespace-qualification
    runs-on: namespace-profile-imrse
    defaults:
      run:
        working-directory: pill-kit/web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: pill-kit/web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run typecheck
      - run: npm run test:browser
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: visual-states
          path: pill-kit/web/test-results
  hosted-macos-qualification:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'verify' && inputs.qualification_only }}
    runs-on: xcode-27
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      TARGET_SOURCE_COMMIT: f391c1815ddbbe41feeaf5d80a510ca76799aab4
      TARGET_SOURCE_TREE: 1c16fa2ef9f5145b18795f9f74740bcd37c5bbd2
    steps:
      - name: Observe hosted Mac prerequisites without checking out or building source
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import plistlib
          import re
          import subprocess
          import sys

          root = Path(os.environ['RUNNER_TEMP']) / 'imrse-hosted-qualification'
          root.mkdir(mode=0o700)
          report = dict(mode='metadata-only', buildPerformed=False, targetSourceVerifiedOnRunner=False, targetSourceCommit=os.environ['TARGET_SOURCE_COMMIT'], targetSourceTree=os.environ['TARGET_SOURCE_TREE'], workflowSHA=os.environ['GITHUB_SHA'], workflowRef=os.environ['GITHUB_WORKFLOW_REF'], runID=os.environ['GITHUB_RUN_ID'], runAttempt=os.environ['GITHUB_RUN_ATTEMPT'], runnerOS=os.environ['RUNNER_OS'], runnerArch=os.environ['RUNNER_ARCH'], imageVersion=os.environ.get('ImageVersion'))
          failures = []

          def observe(name, arguments):
              value = subprocess.run(arguments, cwd=root, capture_output=True, text=True, timeout=30)
              report[name] = dict(exitCode=value.returncode, stdout=value.stdout.strip(), stderr=value.stderr.strip())
              if value.returncode:
                  failures.append(name)
              return value.stdout.strip()

          try:
              if observe('architecture', ['/usr/bin/uname', '-sm']) != 'Darwin arm64':
                  failures.append('darwin-arm64')
              os_version = observe('osVersion', ['/usr/bin/sw_vers', '-productVersion'])
              observe('developerDirectory', ['/usr/bin/xcode-select', '-p'])
              xcode = observe('xcodeVersion', ['/usr/bin/xcodebuild', '-version'])
              swift = observe('swiftVersion', ['/usr/bin/xcrun', 'swift', '--version'])
              sdk = observe('sdkVersion', ['/usr/bin/xcrun', '--sdk', 'macosx', '--show-sdk-version'])
              observe('sdkPath', ['/usr/bin/xcrun', '--sdk', 'macosx', '--show-sdk-path'])
              swift_version = re.search(r'Swift version (\d+)\.(\d+)', swift)
              xcode_version = re.search(r'^Xcode (\d+)', xcode)
              if not xcode_version or int(xcode_version[1]) < 27:
                  failures.append('xcode-27')
              if not swift_version or int(swift_version[1]) != 6 or int(swift_version[2]) < 4:
                  failures.append('swift-6.4-or-newer-6.x')
              if int(os_version.split('.')[0]) < 27 or int(sdk.split('.')[0]) < 27:
                  failures.append('macos-and-sdk-27')
              help_text = observe('swiftBuildHelp', ['/usr/bin/xcrun', 'swift', 'build', '--help'])
              report['requiredBuildFlags'] = {flag: flag in help_text for flag in ['--disable-experimental-prebuilts', '--only-use-versions-from-resolved-file', '--build-system', '--jobs', '--skip-update']}
              if not all(report['requiredBuildFlags'].values()) or 'swiftbuild' not in help_text:
                  failures.append('source-only-build-options')
              observe('metalVersion', ['/usr/bin/xcrun', '--sdk', 'macosx', 'metal', '--version'])
              pressure = observe('memoryPressure', ['/usr/sbin/sysctl', '-n', 'kern.memorystatus_vm_pressure_level'])
              observe('physicalMemoryBytes', ['/usr/sbin/sysctl', '-n', 'hw.memsize'])
              swap = observe('swapUsage', ['/usr/sbin/sysctl', '-n', 'vm.swapusage'])
              used = re.search(r'used\s*=\s*([0-9.]+)([KMG])', swap)
              if pressure != '1' or not used or float(used[1]) != 0:
                  failures.append('normal-pressure-zero-swap')
              filesystem = os.statvfs(root)
              disk_rows = subprocess.check_output(['/bin/df', '-P', str(root)], text=True, timeout=30).splitlines()
              if len(disk_rows) != 2:
                  raise ValueError('filesystem-device-unavailable')
              device = disk_rows[1].split()[0]
              if not re.fullmatch(r'/dev/disk[0-9]+(?:s[0-9]+)*', device):
                  raise ValueError('filesystem-device-invalid')
              volume = plistlib.loads(subprocess.check_output(['/usr/sbin/diskutil', 'info', '-plist', device], timeout=30))
              reference = volume['APFSContainerReference']
              containers = plistlib.loads(subprocess.check_output(['/usr/sbin/diskutil', 'apfs', 'list', '-plist', reference], timeout=30))
              container = next(item for item in containers['Containers'] if item['ContainerReference'] == reference)
              report['capacity'] = dict(filesystemAvailableBytes=filesystem.f_bavail * filesystem.f_frsize, actualAPFSFreeBytes=container['CapacityFree'], containerReference=reference, containerUUID=container['APFSContainerUUID'], startingTargetBytes=16 * 1024**3)
              if min(report['capacity']['filesystemAvailableBytes'], report['capacity']['actualAPFSFreeBytes']) < report['capacity']['startingTargetBytes']:
                  failures.append('starting-disk-capacity')
          except Exception as error:
              failures.append(type(error).__name__ + ': ' + str(error))
          report['failures'] = failures
          report['qualifiedForBuildPreparation'] = not failures
          report['limitations'] = ['No source checkout, dependency resolution, compilation, app launch, signing or installation occurred.', 'Target source identity is a requested binding, not source validation on this runner.', 'A future build uses a fresh VM and requires fresh admission and toolchain/provenance review; this is not app qualification.']
          (root / 'qualification.json').write_text(json.dumps(report, sort_keys=True, indent=2) + '\n')
          print(json.dumps(report, sort_keys=True, indent=2))
          sys.exit(bool(failures))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imrse-hosted-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/imrse-hosted-qualification/qualification.json
          if-no-files-found: error

  hosted-combined-build:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'hosted-combined-535b7f8' }}
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - name: Check out control revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 1
          persist-credentials: false
      - name: Check out exact build source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 0e2ddbd77f5b74a9d4b73a59448363becbbebd0b
          path: source
          fetch-depth: 1
          persist-credentials: false
      - name: Run exact combined build under bounded scope
        id: build
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONNOUSERSITE: "1"
        run: |
          set -euo pipefail
          EVIDENCE="$RUNNER_TEMP/imrse-hosted-combined-535b7f8-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$EVIDENCE"
          /usr/bin/python3 "$GITHUB_WORKSPACE/control/.github/hosted/hosted_combined_scoped_build.py" \
            --control "$GITHUB_WORKSPACE/control" \
            --source "$GITHUB_WORKSPACE/source" \
            --evidence "$EVIDENCE" \
            --control-commit "$GITHUB_SHA" \
            --source-commit 0e2ddbd77f5b74a9d4b73a59448363becbbebd0b \
            --source-tree 3555d346a7fc2538703d34cb238ecf0dc5e4a703
      - name: Export bounded public receipts and any validated unsigned app
        id: export
        if: always()
        timeout-minutes: 2
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONNOUSERSITE: "1"
        run: |
          set -euo pipefail
          /usr/bin/python3 "$GITHUB_WORKSPACE/control/.github/hosted/export_hosted_combined.py" \
            --evidence "$RUNNER_TEMP/imrse-hosted-combined-535b7f8-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --output "$RUNNER_TEMP/imrse-hosted-public-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --control-commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Retain sanitized build receipts and log summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: imrse-hosted-receipts-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: false
          path: |
            ${{ runner.temp }}/imrse-hosted-public-${{ github.run_id }}-${{ github.run_attempt }}/receipts/hosted-combined-receipt.json
            ${{ runner.temp }}/imrse-hosted-public-${{ github.run_id }}-${{ github.run_attempt }}/receipts/build-summary.txt
      - name: Retain the validated unsigned app
        if: ${{ success() && steps.build.outcome == 'success' && steps.export.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: imrse-unsigned-app-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: false
          path: |
            ${{ runner.temp }}/imrse-hosted-public-${{ github.run_id }}-${{ github.run_attempt }}/app/imrse-ci-test-app-arm64.tar.gz
            ${{ runner.temp }}/imrse-hosted-public-${{ github.run_id }}-${{ github.run_attempt }}/app/ci-test-app-manifest.json
            ${{ runner.temp }}/imrse-hosted-public-${{ github.run_id }}-${{ github.run_attempt }}/app/SHA256SUMS
