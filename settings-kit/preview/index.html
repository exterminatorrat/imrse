<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>imrse settings reference</title>
<style>
:root{--bg:#f3f3f3;--window:#fbfbfb;--side:#f5f5f5;--ink:#111;--muted:#7b7b7b;--line:#dedede;--control:#fff;--select:#e9e9e9;--r:16px}
*{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 50% 38%,#fff 0,#f5f5f5 48%,#d8d8d8 100%);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;color:var(--ink);min-height:100vh;display:grid;place-items:center}
.window{width:900px;height:570px;border-radius:15px;background:var(--window);box-shadow:0 28px 70px #0002;display:grid;grid-template-columns:182px 1fr;overflow:hidden;position:relative}
.traffic{position:absolute;left:16px;top:15px;display:flex;gap:7px}.traffic i{width:12px;height:12px;border-radius:50%;display:block}.traffic i:nth-child(1){background:#ff605c}.traffic i:nth-child(2){background:#ffbd44}.traffic i:nth-child(3){background:#00ca4e}
.sidebar{background:linear-gradient(90deg,#f6f6f6,#f2f2f2);padding:62px 12px 18px;display:flex;flex-direction:column}.brand{font-size:28px;letter-spacing:-1.4px;padding:0 10px 28px}.nav{display:flex;flex-direction:column;gap:7px}.nav button,.about{border:0;background:transparent;text-align:left;height:42px;border-radius:9px;padding:0 13px;font-size:13.5px;display:flex;align-items:center;gap:12px;color:#181818;cursor:pointer}.nav button.active,.about.active{background:var(--select)}.ico{width:18px;text-align:center;font-size:16px}.sidegrow{flex:1}.sideLine{height:1px;background:#ddd;margin:0 4px 10px}.about{width:100%}
.content{padding:62px 36px 36px;overflow:hidden}.page{height:100%;overflow:auto;scrollbar-width:none}.page::-webkit-scrollbar{display:none}.title{font-size:26px;font-weight:600;letter-spacing:-.5px;margin:0 0 26px}.divider{height:1px;background:var(--line);margin-bottom:28px}.stack{display:flex;flex-direction:column;gap:28px}.row{min-height:52px;display:grid;grid-template-columns:1fr auto;align-items:start;column-gap:24px}.label{font-size:14px;line-height:20px}.sub{font-size:13px;color:var(--muted);margin-top:2px}.control,.btn,.field{height:34px;border:1px solid #d7d7d7;background:#fff;border-radius:8px;padding:0 12px;font-size:13.5px;display:flex;align-items:center}.control{width:190px;justify-content:space-between}.toggle{width:43px;height:24px;border-radius:20px;background:#d1d1d1;position:relative;margin-top:2px}.toggle:after{content:"";width:20px;height:20px;background:#fff;border-radius:50%;position:absolute;left:2px;top:2px;box-shadow:0 1px 2px #0002}.card{border:1px solid #ddd;border-radius:9px;background:#fff;overflow:hidden}.listrow{height:54px;padding:0 13px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #ececec}.listrow:last-child{border-bottom:0}.meta{font-size:11.5px;color:#8a8a8a;margin-top:2px}.grow{flex:1}.chev{color:#777}.add{margin-top:14px;height:38px;border:1px solid #ddd;border-radius:8px;background:#fff;display:flex;align-items:center;gap:9px;padding:0 13px;font-size:13.5px}.badge{font-size:11px;color:#666;background:#f2f2f2;border-radius:5px;padding:4px 6px}.groupTitle{font-size:13.5px;font-weight:500;margin-bottom:12px}.button{height:30px;border:1px solid #d7d7d7;background:#fff;border-radius:7px;padding:0 13px;font-size:13px}.primary{background:#111;color:#fff;border-color:#111}.danger{color:#d33;background:transparent;border:0}.formRow{display:grid;grid-template-columns:150px 1fr;gap:24px;align-items:start}.textarea{min-height:92px;border:1px solid #d7d7d7;border-radius:8px;background:#fff;padding:10px;font-size:13px;line-height:18px}.editorActions{display:flex;align-items:center;gap:8px}.editorActions .grow{flex:1}.aboutPage{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:18px}.appicon{width:92px;height:92px;border-radius:22px;background:#111;display:grid;place-items:center;margin-bottom:12px}.mark{position:relative;width:58px;height:58px}.mark:before{content:"";position:absolute;width:14px;height:14px;border-radius:50%;background:#fff;left:7px;top:22px}.mark:after{content:"";position:absolute;width:11px;height:34px;border-radius:8px;background:#fff;left:34px;top:13px}.aboutName{font-size:32px;letter-spacing:-1px}.version{font-size:13px;color:#888;margin-top:5px}.links{width:430px;margin-top:34px;border:1px solid #ddd;border-radius:9px;overflow:hidden;background:#fff}.linkrow{height:44px;padding:0 14px;display:flex;align-items:center;border-bottom:1px solid #e8e8e8;font-size:13.5px}.linkrow:last-child{border:0}.copyright{margin-top:auto;font-size:12px;color:#999}.modalShade{position:absolute;inset:0;background:#0005;display:grid;place-items:center}.modal{width:470px;background:#fbfbfb;border-radius:12px;padding:24px;box-shadow:0 30px 80px #0004}.modal h2{font-size:18px;margin:0 0 22px}.modal .formRow{grid-template-columns:92px 1fr;gap:16px;margin:12px 0}.modal .field{width:100%}.modalActions{display:flex;gap:8px;align-items:center;margin-top:22px;padding-top:20px;border-top:1px solid #dedede}.hidden{display:none!important}
</style>
</head>
<body>
<div class="window">
  <div class="traffic"><i></i><i></i><i></i></div>
  <aside class="sidebar">
    <div class="brand">imrse</div>
    <nav class="nav" id="nav"></nav>
    <div class="sidegrow"></div><div class="sideLine"></div>
    <button class="about" data-section="about"><span class="ico">ⓘ</span>About</button>
  </aside>
  <main class="content" id="content"></main>
  <div class="modalShade hidden" id="modal"></div>
</div>
<script>
const navItems=[['general','⚙','General'],['models','◇','Models'],['presets','≡','Presets'],['shortcuts','⌨','Shortcuts'],['advanced','☷','Advanced']];
const presets=[['↔','Expand','⌘1'],['≡','Make Concise','⌘2'],['≋','Improve Writing','⌘3'],['A','Fix Grammar','⌘4'],['✎','Custom Prompt','⌘5']];
const providers=[['◎','OpenAI','gpt-4o'],['A','Anthropic','claude-3.5-sonnet'],['G','Google','gemini-1.5-pro'],['▣','Local','http://localhost:11434']];
const content=document.getElementById('content'), nav=document.getElementById('nav'), modal=document.getElementById('modal');
nav.innerHTML=navItems.map(i=>`<button data-section="${i[0]}"><span class="ico">${i[1]}</span>${i[2]}</button>`).join('');
function page(title,body){return `<div class="page"><h1 class="title">${title}</h1><div class="divider"></div>${body}</div>`}
function general(){return page('General',`<div class="stack">
<div class="row"><div><div class="label">Invocation</div><div class="sub">Shortcut to show imrse.</div></div><div class="control">Double Control <span>⌄</span></div></div>
<div class="row"><div><div class="label">Animation</div><div class="sub">Controls the feel of the experience.</div></div><div class="control">Quick <span>⌄</span></div></div>
<div class="row"><div><div class="label">Launch at login</div><div class="sub">Start imrse automatically when you log in.</div></div><div class="toggle"></div></div>
<div class="row"><div><div class="label">Show in menu bar</div><div class="sub">Keep a small status item in your menu bar.</div></div><div class="toggle"></div></div><div class="divider" style="margin:0"></div>
<div class="row"><div><div class="label">Appearance</div><div class="sub">Follows your system settings.</div></div><div class="control">System <span>⌄</span></div></div></div>`)}
function models(){return page('Models',`<div class="groupTitle">Providers</div><div class="card">${providers.map(p=>`<div class="listrow"><div class="ico">${p[0]}</div><div><div class="label">${p[1]}</div><div class="meta">${p[2]}</div></div><div class="grow"></div><span class="chev">›</span></div>`).join('')}</div><button class="add" id="addProvider">＋ Add Provider</button>`)}
function presetsPage(){return page('Presets',`<div class="card">${presets.map((p,i)=>`<div class="listrow presetEdit" data-i="${i}" style="height:48px"><div class="ico">${p[0]}</div><div class="label">${p[1]}</div><div class="grow"></div><span class="badge">${p[2]}</span></div>`).join('')}</div><button class="add" id="newPreset">＋ New Preset</button>`)}
function presetEditor(name='Improve Writing'){return page('Edit Preset',`<div class="stack" style="gap:20px"><div class="formRow"><div class="label">Name</div><div class="field">${name}</div></div><div class="formRow"><div class="label">Instruction</div><div class="textarea">Improve clarity, grammar, and structure while preserving my tone and meaning.</div></div><div class="formRow"><div class="label">Model</div><div class="control" style="width:100%">Use Default <span>⌄</span></div></div><div class="formRow"><div class="label">Shortcut</div><div class="control" style="width:100%">⌘3 <span>›</span></div></div><div class="formRow"><div><div class="label">Local only</div><div class="sub">Never send this preset to a cloud provider.</div></div><div class="toggle" style="justify-self:end"></div></div><div class="divider" style="margin:0"></div><div class="editorActions"><button class="danger">Delete</button><div class="grow"></div><button class="button" id="cancelPreset">Cancel</button><button class="button primary" id="savePreset">Save</button></div></div>`)}
function shortcuts(){return page('Shortcuts',`<div class="stack"><div><div class="groupTitle">Global Invocation</div><div style="display:flex;gap:10px"><div class="control" style="width:260px">Double Control</div><button class="button">Change…</button></div></div><div class="divider" style="margin:0"></div><div><div class="groupTitle">Preset Shortcuts</div><div class="card">${presets.map(p=>`<div class="listrow" style="height:46px"><div class="ico">${p[0]}</div><div class="label">${p[1]}</div><div class="grow"></div><span class="badge">${p[2]}</span></div>`).join('')}</div></div></div>`)}
function advanced(){return page('Advanced',`<div class="stack" style="gap:24px"><div class="row"><div><div class="label">Config Location</div><div class="sub">Plain-text imrse configuration.</div></div><div style="display:flex;gap:8px"><div class="control" style="width:300px;color:#888">~/Library/Application Support/imrse</div><button class="button">Open…</button></div></div><div class="row"><div><div class="label">Logs</div><div class="sub">Open local diagnostic logs.</div></div><button class="button">Open Logs</button></div><div class="row"><div><div class="label">Diagnostics</div><div class="sub">Inspect runtime state without exposing your text.</div></div><button class="button" id="diagnostics">View…</button></div><div class="row"><div><div class="label">Reset to Defaults</div><div class="sub">Reset General preferences only.</div></div><button class="button">Reset</button></div><div class="divider" style="margin:0"></div><div class="row"><div class="label">Developer Options</div><div class="toggle"></div></div></div>`)}
function about(){return `<div class="aboutPage"><div class="appicon"><div class="mark"></div></div><div class="aboutName">imrse</div><div class="version">v0.1.0</div><div class="links"><div class="linkrow">GitHub<div class="grow"></div>›</div><div class="linkrow">Documentation<div class="grow"></div>›</div><div class="linkrow">Report an Issue<div class="grow"></div>›</div></div><div class="copyright">© 2026 imrse. Open source.</div></div>`}
const renderers={general,models,presets:presetsPage,shortcuts,advanced,about};
function show(section){document.querySelectorAll('[data-section]').forEach(x=>x.classList.toggle('active',x.dataset.section===section));content.innerHTML=renderers[section](); history.replaceState(null,'',`?section=${section}`); wire();}
function wire(){document.getElementById('addProvider')?.addEventListener('click',()=>showProviderModal(false));document.querySelectorAll('.presetEdit').forEach(e=>e.addEventListener('click',()=>{content.innerHTML=presetEditor(presets[+e.dataset.i][1]);wire()}));document.getElementById('newPreset')?.addEventListener('click',()=>{content.innerHTML=presetEditor('');wire()});document.getElementById('cancelPreset')?.addEventListener('click',()=>show('presets'));document.getElementById('savePreset')?.addEventListener('click',()=>show('presets'));document.getElementById('diagnostics')?.addEventListener('click',showDiagnostics)}
function showProviderModal(edit){modal.classList.remove('hidden');modal.innerHTML=`<div class="modal"><h2>${edit?'Edit':'Add'} Provider</h2><div class="formRow"><div class="sub">Name</div><div class="field">${edit?'Local':'e.g. Local LLM'}</div></div><div class="formRow"><div class="sub">Type</div><div class="control" style="width:100%">OpenAI Compatible <span>⌄</span></div></div><div class="formRow"><div class="sub">Base URL</div><div class="field">${edit?'http://localhost:11434':'https://'}</div></div><div class="formRow"><div class="sub">API Key</div><div class="field">••••••••</div></div><div class="modalActions">${edit?'<button class="danger">Delete</button>':''}<div class="grow"></div><button class="button" id="modalCancel">Cancel</button><button class="button primary">${edit?'Save':'Add'}</button></div></div>`;document.getElementById('modalCancel').onclick=()=>modal.classList.add('hidden')}
function showDiagnostics(){modal.classList.remove('hidden');modal.innerHTML=`<div class="modal"><h2>Diagnostics</h2><div class="card">${[['Accessibility','Granted'],['Global Shortcut','Active'],['Frontmost App','com.apple.TextEdit'],['Selection','Available (124 chars)'],['Provider','OpenAI (gpt-4o)'],['State','Idle'],['Last Error','None']].map(x=>`<div class="listrow" style="height:38px"><div class="sub" style="width:130px">${x[0]}</div><div class="sub">${x[1]}</div></div>`).join('')}</div><div class="modalActions"><div class="grow"></div><button class="button">Copy Diagnostic Report</button><button class="button primary" id="modalCancel">Done</button></div></div>`;document.getElementById('modalCancel').onclick=()=>modal.classList.add('hidden')}
document.querySelectorAll('[data-section]').forEach(b=>b.addEventListener('click',()=>show(b.dataset.section)));
show(new URLSearchParams(location.search).get('section')||'general');
</script>
</body>
</html>
